# Manual only: this makes paid OpenAI calls. Never runs on pull requests.
name: Evaluation (manual)
on:
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          python -m scripts.download_data
          python -m scripts.sample_catalog --size 10000
          python -m app.ingestion --yes
          python -m evaluation.run --retrieval-only --floor recall@5=0.4
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
