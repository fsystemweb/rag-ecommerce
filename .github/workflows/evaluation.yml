# Manual only: this makes paid Nebius calls. Never runs on pull requests.
name: Evaluation (manual)
on:
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          python -m scripts.download_data
          python -m scripts.sample_catalog --size 2000
          python -m src.ingestion --yes
          python -m src.evaluation.evaluator --retrieval-only --floor recall@5=0.4
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
